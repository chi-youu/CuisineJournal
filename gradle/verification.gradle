regressionTests.each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        if (taskName == 'verifyLayerDependencies') {
            // The verifier reads optional compile-only API headers, never initializes their classes.
            classpath += sourceSets.main.compileClasspath
        }
        mainClass = entryPoint
        if (taskName == 'verifyProductionCodeHygiene') {
            systemProperty 'cuisinejournal.productionClasses', sourceSets.main.java.classesDirectory.get().asFile.absolutePath
        }
        if (taskName == 'auditPlacedFoodPaths') {
            onlyIf { System.getenv('CUISINEJOURNAL_COMPAT_MODS') != null }
        }
    }
}

tasks.named('check').configure { dependsOn regressionTests.keySet() }
tasks.named('test', Test).configure {
    dependsOn 'verifyFoodMath', 'verifySolMigration'
}

tasks.register('verifyProductionArtifact') {
    dependsOn 'reobfJar', 'testClasses'
    doLast {
        def testClasses = sourceSets.test.output.classesDirs.files.collectMany { root ->
            fileTree(root).matching { include '**/*.class' }.files.collect {
                root.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            }
        }.toSet()
        new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.startsWith('com/chi__you/cuisinejournal/food/mixin/')) {
                    throw new GradleException('Old flat Mixin package remains in artifact: ' + entry.name)
                }
                if (entry.name == 'com/chi__you/cuisinejournal/client/journal/JournalBlur.class'
                        || entry.name == 'assets/cuisinejournal/shaders/post/journal_blur.json') {
                    throw new GradleException('Removed journal postprocessor remains in artifact: ' + entry.name)
                }
                if (testClasses.contains(entry.name) || entry.name.endsWith('.log')
                        || entry.name.endsWith('.pyc') || entry.name.endsWith('.java')
                        || entry.name.startsWith('assets/mealmastery/') || entry.name.startsWith('data/mealmastery/')
                        || entry.name.contains('/b006_')
                        || entry.name.startsWith('org/junit/') || entry.name.startsWith('org/mockito/')) {
                    throw new GradleException('Development-only content in production jar: ' + entry.name)
                }
            }
        }
        println 'ProductionArtifact: no test classes, source files or temporary logs packaged'
    }
}
tasks.named('build').configure { dependsOn 'verifyProductionArtifact' }
