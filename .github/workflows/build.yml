name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check repository files
        run: |
          python3 tools/test_prepare_repository.py
          python3 tools/prepare_repository.py --report build/repository-preparation/report.json
      - name: Build and run regressions
        run: bash ./gradlew build --no-daemon
